rem" }, "fontFamily": { "body-sm": ["Inter"], "title-md": ["Inter"], "headline-md": ["Inter"], "headline-lg": ["Inter"], "body-lg": ["Inter"], "display-sm": ["Inter"], "label-md": ["Inter"], "body-md": ["Inter"], "headline-sm": ["Inter"], "label-legal": ["Inter"], "label-lg": ["Inter"] }, "fontSize": { "body-sm": ["0.8125rem", { "lineHeight": "1.25rem", "fontWeight": "400" }], "title-md": ["1rem", { "lineHeight": "1.5rem", "fontWeight": "600" }], "headline-md": ["1.25rem", { "lineHeight": "1.75rem", "letterSpacing": "-0.01em", "fontWeight": "600" }], "headline-lg": ["1.5rem", { "lineHeight": "2rem", "letterSpacing": "-0.015em", "fontWeight": "600" }], "body-lg": ["1rem", { "lineHeight": "1.625rem", "fontWeight": "400" }], "display-sm": ["1.75rem", { "lineHeight": "2.25rem", "letterSpacing": "-0.02em", "fontWeight": "700" }], "label-md": ["0.75rem", { "lineHeight": "1rem", "letterSpacing": "0.04em", "fontWeight": "600" }], "body-md": ["0.875rem", { "lineHeight": "1.375rem", "fontWeight": "400" }], "headline-sm": ["1.125rem", { "lineHeight": "1.5rem", "fontWeight": "600" }], "label-legal": ["0.6875rem", { "lineHeight": "0.875rem", "letterSpacing": "0.06em", "fontWeight": "600" }], "label-lg": ["0.875rem", { "lineHeight": "1.25rem", "letterSpacing": "0.01em", "fontWeight": "500" }] } } } };</script><style>@layer base { html, body { margin: 0; padding: 0; min-height: 100%; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } main > :first-child { margin-top: 0 !important; } main > :last-child { margin-bottom: 0 !important; } } ::-webkit-scrollbar { display: none; }</style></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased min-h-screen flex flex-col"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm min-w-0"><button aria-label="Go back" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface font-semibold tracking-tight truncate">Edit Profile</h1></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 pb-space-xl bg-surface"><div class="flex flex-col w-full space-y-space-lg px-margin pb-space-xl"><!-- Avatar Editor Section -->
<div class="w-full bg-surface-container-lowest rounded-2xl p-space-lg flex flex-col items-center justify-center text-center shadow-sm relative overflow-hidden">
  <div class="relative group mb-space-md">
    <div class="w-24 h-24 rounded-full overflow-hidden shadow-md bg-surface-container flex items-center justify-center">
      <img class="w-full h-full object-cover" id="user-avatar-preview" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDoGpERvYa4YoUpXQWjk7yNnHVEFABBgnnfq5Pgrt8i0VuN_-zx-3cx4NjFesXMcR6-1ijE2yIinoymMEG5-Uw73C58XuneWK5L_HIvoDDarhu1g5ypX_NJDRVuh3GwZX8U59IbJZ1yY-RMDmbzMmKV1jKyFYD5_fDhylA1IVhOMkH1JDuFIM-l0knNhFZFqp5883l9bHjh0BDnSaajJglnV4XRJYsQPJsaqQdCtBms9LlUm0RmQXih8w" alt="Profile photo">
    </div>
    <button aria-label="Quick update photo" class="absolute bottom-0 right-0 w-8 h-8 rounded-full bg-primary-container text-surface-container-lowest flex items-center justify-center shadow-md active:scale-95 transition-transform" onclick="document.getElementById('avatar-file-input').click()" type="button">
      <span class="material-symbols-outlined text-[18px]">photo_camera</span>
    </button>
    <input accept="image/*" class="hidden" id="avatar-file-input" onchange="simulateAvatarChange(event)" type="file">
  </div>
  <div class="flex items-center gap-space-sm">
    <button class="px-space-md py-1.5 rounded-full bg-surface-container hover:bg-surface-container-high text-on-surface font-label-lg text-label-lg transition-colors flex items-center gap-1.5" onclick="document.getElementById('avatar-file-input').click()" type="button">
      <span class="material-symbols-outlined text-[16px]">edit</span>
      <span class="">Change Photo</span>
    </button>
    <button class="px-space-md py-1.5 rounded-full bg-surface-container-low hover:bg-error-container text-error font-label-lg text-label-lg transition-colors flex items-center gap-1.5" onclick="resetAvatar()" type="button">
      <span class="material-symbols-outlined text-[16px]">delete</span>
      <span class="">Remove</span>
    </button>
  </div>
</div>

<!-- Streamlined Profile Inputs Card -->
<div class="w-full bg-surface-container-lowest rounded-2xl p-space-lg shadow-sm space-y-space-md">
  <!-- Full Name Input -->
  <div class="space-y-1.5">
    <label class="block font-label-md text-label-md text-on-surface-variant font-medium" for="fullName">Full Name</label>
    <div class="relative rounded-xl bg-surface-container-low focus-within:bg-surface-container-lowest transition-colors">
      <div class="absolute inset-y-0 left-0 pl-space-md flex items-center pointer-events-none text-secondary">
        <span class="material-symbols-outlined text-[20px]">person</span>
      </div>
      <input class="w-full pl-11 pr-space-md py-3.5 bg-transparent rounded-xl font-body-md text-body-md text-on-surface focus:outline-none" id="fullName" name="fullName" placeholder="Your name" type="text" value="Vikram Malhotra">
    </div>
  </div>

  <!-- Email (Optional) Input -->
  <div class="space-y-1.5">
    <label class="block font-label-md text-label-md text-on-surface-variant font-medium" for="email">Email (Optional)</label>
    <div class="relative rounded-xl bg-surface-container-low focus-within:bg-surface-container-lowest transition-colors">
      <div class="absolute inset-y-0 left-0 pl-space-md flex items-center pointer-events-none text-secondary">
        <span class="material-symbols-outlined text-[20px]">mail</span>
      </div>
      <input class="w-full pl-11 pr-space-md py-3.5 bg-transparent rounded-xl font-body-md text-body-md text-on-surface focus:outline-none" id="email" name="email" placeholder="email@example.com" type="email" value="vikram.m@example.com">
    </div>
  </div>

  <!-- Preferred Language Dropdown -->
  <div class="space-y-1.5">
    <label class="block font-label-md text-label-md text-on-surface-variant font-medium" for="languagePreference">Preferred Language</label>
    <div class="relative rounded-xl bg-surface-container-low focus-within:bg-surface-container-lowest transition-colors">
      <div class="absolute inset-y-0 left-0 pl-space-md flex items-center pointer-events-none text-secondary">
        <span class="material-symbols-outlined text-[20px]">translate</span>
      </div>
      <select class="w-full pl-11 pr-10 py-3.5 bg-transparent rounded-xl font-body-md text-body-md text-on-surface appearance-none focus:outline-none cursor-pointer" id="languagePreference" name="languagePreference">
        <option selected="" value="en">English</option>
        <option value="hi">Hindi</option>
        <option value="kn">Kannada</option>
        <option value="mr">Marathi</option>
        <option value="ta">Tamil</option>
        <option value="te">Telugu</option>
        <option value="bn">Bengali</option>
      </select>
      <div class="absolute inset-y-0 right-0 pr-space-md flex items-center pointer-events-none text-secondary">
        <span class="material-symbols-outlined text-[20px]">expand_more</span>
      </div>
    </div>
  </div>

  <!-- State (Optional) Dropdown -->
  <div class="space-y-1.5">
    <label class="block font-label-md text-label-md text-on-surface-variant font-medium" for="stateJurisdiction">State (Optional)</label>
    <div class="relative rounded-xl bg-surface-container-low focus-within:bg-surface-container-lowest transition-colors">
      <div class="absolute inset-y-0 left-0 pl-space-md flex items-center pointer-events-none text-secondary">
        <span class="material-symbols-outlined text-[20px]">location_on</span>
      </div>
      <select class="w-full pl-11 pr-10 py-3.5 bg-transparent rounded-xl font-body-md text-body-md text-on-surface appearance-none focus:outline-none cursor-pointer" id="stateJurisdiction" name="stateJurisdiction">
        <option selected="" value="Karnataka">Karnataka</option>
        <option value="Delhi">Delhi</option>
        <option value="Maharashtra">Maharashtra</option>
        <option value="Tamil Nadu">Tamil Nadu</option>
        <option value="Uttar Pradesh">Uttar Pradesh</option>
        <option value="West Bengal">West Bengal</option>
        <option value="Telangana">Telangana</option>
        <option value="Other">Other</option>
      </select>
      <div class="absolute inset-y-0 right-0 pr-space-md flex items-center pointer-events-none text-secondary">
        <span class="material-symbols-outlined text-[20px]">expand_more</span>
      </div>
    </div>
  </div>
</div>

<!-- Action Footer Block -->
<div class="w-full pt-space-xs space-y-space-sm">
  <button class="w-full h-[52px] rounded-xl bg-primary-container text-on-primary font-label-lg text-label-lg font-semibold flex items-center justify-center gap-2 shadow-md active:scale-[0.99] transition-transform" onclick="saveProfileChanges()" type="button">
    <span class="">Save Changes</span>
  </button>
  <button class="w-full h-[48px] rounded-xl bg-transparent hover:bg-surface-container text-secondary font-label-lg text-label-lg font-medium flex items-center justify-center gap-2 transition-colors" onclick="history.back()" type="button">
    <span class="">Cancel</span>
  </button>
</div>

<!-- Toast Notification Container -->
<div class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-space-md py-2.5 rounded-full shadow-lg font-label-md text-label-md flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-300 z-50" id="toast-pill">
  <span class="material-symbols-outlined text-[18px] text-tertiary-fixed" id="toast-icon">check_circle</span>
  <span id="toast-msg" class="">Profile updated successfully</span>
</div></div>
<script>
  function showToast(message, icon = 'check_circle') {
    const toast = document.getElementById('toast-pill');
    const msg = document.getElementById('toast-msg');
    const ico = document.getElementById('toast-icon');
    if (!toast || !msg || !ico) return;
    
    msg.textContent = message;
    ico.textContent = icon;
    toast.classList.remove('opacity-0', 'pointer-events-none');
    toast.classList.add('opacity-100');
    
    setTimeout(() => {
      toast.classList.remove('opacity-100');
      toast.classList.add('opacity-0', 'pointer-events-none');
    }, 2800);
  }

  function simulateAvatarChange(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const preview = document.getElementById('user-avatar-preview');
        if (preview) {
          preview.src = e.target.result;
          showToast('Profile photo updated', 'photo');
        }
      };
      reader.readAsDataURL(file);
    }
  }

  function resetAvatar() {
    const preview = document.getElementById('user-avatar-preview');
    if (preview) {
      preview.src = 'placeholder';
      showToast('Avatar removed to default', 'delete');
    }
  }

  function openOtpReverificationModal() {
    const modal = document.getElementById('otp-modal');
    if (modal) {
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }
  }

  function closeOtpModal() {
    const modal = document.getElementById('otp-modal');
    if (modal) {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }
  }

  function sendOtpTrigger() {
    const btn = document.getElementById('otp-btn');
    if (btn) {
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">sync</span><span>Sending OTP...</span>';
      setTimeout(() => {
        closeOtpModal();
        btn.innerHTML = '<span class="material-symbols-outlined text-[20px]">sms</span><span>Send OTP for Verification</span>';
        showToast('OTP transmitted to +91 98765 43210', 'mark_email_read');
      }, 1000);
    }
  }

  function saveProfileChanges() {
    const name = document.getElementById('fullName').value.trim();
    const jurisdiction = document.getElementById('stateJurisdiction').value;
    showToast(`Preferences saved for ${name || 'Advocate'} (${jurisdiction})`, 'verified');
  }
</script></main>

</body></html>
