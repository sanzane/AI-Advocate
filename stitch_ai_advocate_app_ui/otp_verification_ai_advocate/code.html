<script>
  // Simple countdown decrement simulation for UI delight
  (function initTimer() {
    let secondsLeft = 28;
    const countdownEl = document.getElementById('resend-countdown');
    if (!countdownEl) return;
    
    const interval = setInterval(() => {
      secondsLeft--;
      if (secondsLeft <= 0) {
        clearInterval(interval);
        countdownEl.innerHTML = '<button class="text-primary-container font-semibold underline underline-offset-2">Resend OTP now</button>';
      } else {
        const formatted = secondsLeft < 10 ? '0' + secondsLeft : secondsLeft;
        countdownEl.textContent = 'Resend OTP in 0:' + formatted;
      }
    }, 1000);
  })();
