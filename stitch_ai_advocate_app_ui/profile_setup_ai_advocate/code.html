<!DOCTYPE html><html class="h-full" lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-container": "#f0eee9", "error": "#ba1a1a", "tertiary-fixed-dim": "#b9c3ff", "on-tertiary-fixed-variant": "#0035be", "on-secondary-fixed": "#0d1c32", "on-primary-fixed-variant": "#3d475b", "secondary": "#515f78", "inverse-surface": "#30312e", "primary-container": "#121c2e", "on-secondary": "#ffffff", "primary-fixed-dim": "#bdc6df", "on-secondary-fixed-variant": "#394760", "on-surface": "#1b1c19", "on-secondary-container": "#55637d", "tertiary": "#000000", "on-primary-container": "#7a849a", "secondary-container": "#d2e0ff", "surface-tint": "#555e73", "surface-container-high": "#eae8e3", "surface-container-low": "#f5f3ee", "on-tertiary-fixed": "#001356", "surface-dim": "#dbdad5", "outline-variant": "#c5c6cd", "surface-variant": "#e4e2dd", "tertiary-container": "#001356", "error-container": "#ffdad6", "tertiary-fixed": "#dde1ff", "surface-container-lowest": "#ffffff", "on-tertiary-container": "#5a79ff", "on-primary": "#ffffff", "surface-bright": "#fbf9f4", "outline": "#75777d", "surface": "#fbf9f4", "secondary-fixed": "#d6e3ff", "on-tertiary": "#ffffff", "on-primary-fixed": "#121c2e", "on-error": "#ffffff", "secondary-fixed-dim": "#b9c7e5", "on-error-container": "#93000a", "primary-fixed": "#d9e2fc", "on-surface-variant": "#45474c", "primary": "#000000", "background": "#fbf9f4", "inverse-on-surface": "#f2f1ec", "inverse-primary": "#bdc6df", "surface-container-highest": "#e4e2dd", "on-background": "#1b1c19" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-md": "1rem", "margin-compact": "1rem", "space-xl": "2rem", "margin": "1.25rem", "gutter": "0.75rem", "space-sm": "0.5rem", "space-lg": "1.5rem", "margin-expanded": "1.5rem", "space-xs": "0.25rem" }, "fontFamily": { "body-sm": ["Inter"], "title-md": ["Inter"], "headline-md": ["Inter"], "headline-lg": ["Inter"], "body-lg": ["Inter"], "display-sm": ["Inter"], "label-md": ["Inter"], "body-md": ["Inter"], "headline-sm": ["Inter"], "label-legal": ["Inter"], "label-lg": ["Inter"] }, "fontSize": { "body-sm": ["0.8125rem", { "lineHeight": "1.25rem", "fontWeight": "400" }], "title-md": ["1rem", { "lineHeight": "1.5rem", "fontWeight": "600" }], "headline-md": ["1.25rem", { "lineHeight": "1.75rem", "letterSpacing": "-0.01em", "fontWeight": "600" }], "headline-lg": ["1.5rem", { "lineHeight": "2rem", "letterSpacing": "-0.015em", "fontWeight": "600" }], "body-lg": ["1rem", { "lineHeight": "1.625rem", "fontWeight": "400" }], "display-sm": ["1.75rem", { "lineHeight": "2.25rem", "letterSpacing": "-0.02em", "fontWeight": "700" }], "label-md": ["0.75rem", { "lineHeight": "1rem", "letterSpacing": "0.04em", "fontWeight": "600" }], "body-md": ["0.875rem", { "lineHeight": "1.375rem", "fontWeight": "400" }], "headline-sm": ["1.125rem", { "lineHeight": "1.5rem", "fontWeight": "600" }], "label-legal": ["0.6875rem", { "lineHeight": "0.875rem", "letterSpacing": "0.06em", "fontWeight": "600" }], "label-lg": ["0.875rem", { "lineHeight": "1.25rem", "letterSpacing": "0.01em", "fontWeight": "500" }] } } } };</script><style>@layer base { html, body { margin: 0; padding: 0; min-height: 100%; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } main > :first-child { margin-top: 0 !important; } main > :last-child { margin-bottom: 0 !important; } } ::-webkit-scrollbar { display: none; }</style></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased min-h-screen flex flex-col pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full px-margin pb-safe space-y-space-lg">
<!-- Progress Header -->
<div class="flex items-center justify-between pt-space-sm"><div></div>
<button class="font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface active:opacity-70 transition-opacity" type="button">
  Skip for now
</button></div>
<!-- Warm Conversational Header & Mascot Delight -->
<div class="flex items-start justify-between"><div class="space-y-space-xs">
  <h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">Set up your profile</h1>
  <p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
    Tell us a little about yourself.
  </p>
</div></div>
<!-- Main Profile Card Container -->
<div class="w-full bg-surface-container-lowest rounded-xl shadow-sm p-space-lg space-y-space-lg">
<!-- Avatar Upload with Playful Touch -->
<div class="flex flex-col items-center justify-center space-y-space-xs">
<div class="relative group cursor-pointer">
<div class="w-24 h-24 rounded-full bg-surface-container-low flex items-center justify-center overflow-hidden shadow-inner transition-transform active:scale-95">
<span class="material-symbols-outlined text-4xl text-on-surface-variant opacity-60">person</span>
</div>
<div class="absolute bottom-0 right-0 w-8 h-8 rounded-full bg-on-tertiary-container text-on-primary flex items-center justify-center shadow-md active:scale-90 transition-transform">
<span class="material-symbols-outlined text-base">photo_camera</span>
</div>
</div>
<button class="font-label-md text-label-md text-on-surface-variant hover:text-on-surface flex items-center space-x-1 pt-1" type="button">
<span class="">Add photo (Optional)</span>
<span class="material-symbols-outlined text-xs">spark</span>
</button>
</div>
<!-- Interactive Form -->
<form class="space-y-space-md" onsubmit="event.preventDefault();"><!-- Full Name Field -->
<div class="space-y-1.5">
  <label class="block font-label-lg text-label-lg text-on-surface font-semibold" for="fullName">
    Full Name <span class="text-error">*</span>
  </label>
  <div class="relative flex items-center">
    <span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-xl pointer-events-none">badge</span>
    <input class="w-full h-12 pl-11 pr-4 bg-surface-container-low rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:bg-surface-container-lowest focus:ring-2 focus:ring-on-tertiary-container outline-none transition-all" id="fullName" placeholder="e.g. Vikram Malhotra" required="" type="text" value="Vikram Malhotra">
  </div>
</div>

<!-- Preferred Language Dropdown -->
<div class="space-y-1.5">
  <label class="block font-label-lg text-label-lg text-on-surface font-semibold" for="languageSelect">
    Preferred Language
  </label>
  <div class="relative flex items-center">
    <span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-xl pointer-events-none">translate</span>
    <select class="w-full h-12 pl-11 pr-10 bg-surface-container-low rounded-lg font-body-md text-body-md text-on-surface appearance-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-on-tertiary-container outline-none transition-all cursor-pointer" id="languageSelect">
      <option selected="" value="English">English</option>
      <option value="Hindi">Hindi (हिंदी)</option>
      <option value="Tamil">Tamil (தமிழ்)</option>
      <option value="Telugu">Telugu (తెలుగు)</option>
      <option value="Marathi">Marathi (मराठी)</option>
    </select>
    <span class="material-symbols-outlined absolute right-3.5 text-on-surface-variant text-xl pointer-events-none">expand_more</span>
  </div>
</div>

<!-- State Dropdown -->
<div class="space-y-1.5">
  <label class="block font-label-lg text-label-lg text-on-surface font-semibold" for="jurisdictionState">
    State / Union Territory <span class="text-error">*</span>
  </label>
  <div class="relative flex items-center">
    <span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-xl pointer-events-none">location_on</span>
    <select class="w-full h-12 pl-11 pr-10 bg-surface-container-low rounded-lg font-body-md text-body-md text-on-surface appearance-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-on-tertiary-container outline-none transition-all cursor-pointer" id="jurisdictionState">
      <option selected="" value="Karnataka">Karnataka</option>
      <option value="Delhi">Delhi</option>
      <option value="Maharashtra">Maharashtra</option>
      <option value="Tamil Nadu">Tamil Nadu</option>
      <option value="West Bengal">West Bengal</option>
      <option value="Uttar Pradesh">Uttar Pradesh</option>
      <option value="Telangana">Telangana</option>
    </select>
    <span class="material-symbols-outlined absolute right-3.5 text-on-surface-variant text-xl pointer-events-none">expand_more</span>
  </div>
</div></form>
</div>
<!-- Trust & Privacy Card -->

<!-- Primary Bottom Actions Sticky Layout -->
<div class="pt-space-xs space-y-space-sm pb-space-md"><button class="w-full h-[52px] bg-[#4263EB] text-on-primary rounded-xl font-label-lg text-label-lg font-semibold flex items-center justify-center space-x-2 shadow-md hover:opacity-95 active:scale-[0.99] transition-all" id="saveProfileBtn" type="button">
  <span class="">Continue</span>
  <span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
<button class="w-full py-2.5 font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface transition-colors text-center" type="button">
  Skip for now
</button></div>
</div>
<script>
  // Micro-interaction for language selection pills
  document.querySelectorAll('form button').forEach((pill) => {
    pill.addEventListener('click', function(e) {
      if (this.closest('.flex-wrap')) {
        const parent = this.closest('.flex-wrap');
        parent.querySelectorAll('button').forEach(btn => {
          btn.className = "h-8 px-3 rounded-full bg-surface-container text-on-surface font-label-md text-label-md hover:bg-surface-container-high active:scale-95 transition-transform";
          if (btn.querySelector('.material-symbols-outlined')) {
            btn.querySelector('.material-symbols-outlined').remove();
          }
        });
        this.className = "h-8 px-3 rounded-full bg-primary-container text-on-primary font-label-md text-label-md flex items-center space-x-1 shadow-sm active:scale-95 transition-transform";
        const icon = document.createElement('span');
        icon.className = "material-symbols-outlined text-sm";
        icon.innerText = "check";
        this.prepend(icon);
      }
    });
  });

  // Haptic feedback simulation on primary button
  const saveBtn = document.getElementById('saveProfileBtn');
  if (saveBtn) {
    saveBtn.addEventListener('click', () => {
      saveBtn.innerHTML = `
        <span class="material-symbols-outlined animate-spin text-xl">progress_activity</span>
        <span>Configuring Briefs...</span>
      `;
      setTimeout(() => {
        saveBtn.innerHTML = `
          <span class="material-symbols-outlined text-xl">check_circle</span>
          <span>Profile Ready!</span>
        `;
      }, 700);
    });
  }
</script></main>

</body></html>
